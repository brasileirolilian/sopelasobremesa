<a class="post-card group" href="{{ include.post.url | relative_url }}">
  {% if include.post.image %}
  <div class="post-cover-wrapper">
    <img src="{{ include.post.image | relative_url }}" class="post-cover" alt="{{ include.post.title }}">
  </div>
  {% endif %}
  <div class="post-card-content">
    <span class="post-meta">{{ include.post.date | date: "%d de %b, %Y" | upcase }} · {% include reading-time.html post=include.post %}</span>
    <h3 class="post-title">{{ include.post.title | escape }}</h3>
    <p class="post-excerpt">
      {{ include.post.excerpt | strip_html | truncatewords: 20 }}
    </p>
  </div>
</a>
