---
layout: default
---
<div class="container">
  <article class="post-detail" itemscope itemtype="http://schema.org/BlogPosting">
    <header class="post-header">
      <h1 class="post-title" itemprop="name headline">{{ page.title | escape }}</h1>
      <p class="post-meta">
        <time datetime="{{ page.date | date_to_xmlschema }}" itemprop="datePublished">
          {{ page.date | date: "%d de %b de %Y" }}
        </time>
        {%- if page.author -%}
        • <span itemprop="author" itemscope itemtype="http://schema.org/Person"><span itemprop="name">{{ page.author
            }}</span></span>
        {%- endif -%}
      </p>

      {% if page.image %}
      <img src="{{ page.image | relative_url }}" alt="{{ page.title | escape }}" class="post-detail-cover">
      {% endif %}
    </header>

    {% include share_buttons.html %}
    <hr class="share-divider">

    <div class="post-content" itemprop="articleBody">
      {{ content }}
    </div>

    <hr class="share-divider">
    {% include share_buttons.html %}
  </article>
</div>
