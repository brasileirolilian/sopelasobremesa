<!DOCTYPE html>
<html lang="{{ page.lang | default: site.lang | default: "pt-BR" }}">
  {% include head.html %}
  <body>
    {% include header.html %}
    
    <main class="page-content" aria-label="Content">
      <div class="container">
        {{ content }}
      </div>
    </main>

    {% if paginator or page.url == '/' or page.url == '/index.html' %}
      <div style="background-color: #fdf0d8; padding: 80px 0; margin-top: 80px; margin-bottom: -80px;">
        <div class="container">
          {% include author.html %}
        </div>
      </div>
    {% endif %}

    {% include footer.html %}
  </body>
</html>
