name: "Lílian Brasileiro"
bio: >
  Formada em Produção Editorial, adora cinema e livros. Gosta de vinhos, special beers e uns bons tragos.
  Foodaholic desde que nasceu; descobriu nos aromas, cores, texturas e sabores da gastronomia o sentido da
  vida. Mas, foi pelo açúcar que seu coração bateu mais forte.
